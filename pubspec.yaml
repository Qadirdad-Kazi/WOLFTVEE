name: wolftvee
description: WOLFTVEE — intense flat streaming app for movies, series, and live TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  cached_network_image: ^4.0.0
  go_router: ^18.0.1
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  youtube_player_flutter: ^10.0.1
  intl: ^0.20.2
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  flutter_inappwebview: ^6.1.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
    - .env.example
